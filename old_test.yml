name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Unit and functional tests on every OS the launch scripts support.
  server:
    name: unit + functional (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  # The browser suite, against the Chrome preinstalled on the runner.
  e2e:
    name: puppeteer (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          E2E_REQUIRED: '1'
          CHROME_PATH: /usr/bin/google-chrome
